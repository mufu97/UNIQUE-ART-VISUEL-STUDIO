services:
  - type: web
    name: unique-art-visuel-studio
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: unique-art-database
          property: connectionString
      - key: PORT
        value: 10000

databases:
  - name: unique-art-database
    databaseName: unique_art
    user: unique_art
    plan: free
